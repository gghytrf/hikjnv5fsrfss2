<!DOCTYPE html>
<html lang="ja">
<head>
<script>
/* ===== 統合アプリ用ガード（自動挿入・元コードは未変更）=====
   iframe 内で動くとき、各アプリ独自の Service Worker 登録／キャッシュ操作／
   バージョン確認を無効化し、キャッシュとバージョン管理を親（統合ホーム）へ
   一元化します。localStorage（学習データ・カルテ等）はそのまま使えます。 */
(function(){
  try{
    if (window.top === window.self) return; // 単体起動時は何もしない

    // 1) Service Worker を無害なスタブに
    var swStub = {
      register:function(){ return Promise.reject(new Error('SW disabled in integrated app')); },
      getRegistration:function(){ return Promise.resolve(undefined); },
      getRegistrations:function(){ return Promise.resolve([]); },
      addEventListener:function(){}, removeEventListener:function(){},
      get controller(){ return null; },
      ready:new Promise(function(){})
    };
    try{ Object.defineProperty(navigator,'serviceWorker',{get:function(){return swStub;},configurable:true}); }catch(e){}

    // 2) Cache Storage を無効化（子アプリが親のキャッシュを消さないように）
    var noop0=function(){return Promise.resolve();};
    function neutralizeCaches(){
      try{
        var cacheStub={
          open:function(){return Promise.resolve({addAll:noop0,add:noop0,put:noop0,
            match:function(){return Promise.resolve(undefined);},delete:function(){return Promise.resolve(false);},
            keys:function(){return Promise.resolve([]);}});},
          keys:function(){return Promise.resolve([]);},
          delete:function(){return Promise.resolve(false);},
          match:function(){return Promise.resolve(undefined);},
          has:function(){return Promise.resolve(false);}
        };
        try{ Object.defineProperty(window,'caches',{get:function(){return cacheStub;},configurable:true}); }
        catch(e){
          // defineProperty が不可なら既存オブジェクトのメソッドを直接無害化
          if(window.caches){
            try{ window.caches.keys=function(){return Promise.resolve([]);}; }catch(_){}
            try{ window.caches.delete=function(){return Promise.resolve(false);}; }catch(_){}
            try{ window.caches.open=cacheStub.open; }catch(_){}
          }
        }
      }catch(e){}
    }
    neutralizeCaches();

    // 3) アプリ独自の「更新」ボタンを隠す（親の「更新確認」に一本化）
    var css='/* karuta: 非表示にする独自要素なし */';
    function injectCss(){ try{ var s=document.createElement('style'); s.textContent=css; (document.head||document.documentElement).appendChild(s);}catch(e){} }
    if(document.head){ injectCss(); }
    else { document.addEventListener('DOMContentLoaded', injectCss); }
  }catch(e){}
  // ===== コピー無効化（コンテンツ保護）=====
  var cpCss = document.createElement('style');
  cpCss.textContent =
    'html{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;' +
    '-webkit-touch-callout:none;}' +
    'input,textarea,[contenteditable="true"],[contenteditable=""]{' +
    '-webkit-user-select:text !important;-moz-user-select:text !important;' +
    '-ms-user-select:text !important;user-select:text !important;-webkit-touch-callout:default !important;}';
  (document.head||document.documentElement).appendChild(cpCss);
  var isEditable = function(t){
    if(!t) return false;
    var tag=(t.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea') return true;
    if(t.isContentEditable) return true;
    return false;
  };
  document.addEventListener('contextmenu', function(e){ if(!isEditable(e.target)) e.preventDefault(); }, {capture:true});
  document.addEventListener('copy',      function(e){ if(!isEditable(e.target)) e.preventDefault(); }, {capture:true});
  document.addEventListener('cut',       function(e){ if(!isEditable(e.target)) e.preventDefault(); }, {capture:true});
  document.addEventListener('dragstart', function(e){ if(!isEditable(e.target)) e.preventDefault(); }, {capture:true});

  })();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>経穴 読み上げアプリ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap');

  :root {
    --ink:       #1a1a1a;
    --cinnabar:  #b84c3c;
    --gold:      #c9972a;
    --sage:      #5a7a5c;
    --paper:     #f5f0e8;
    --paper2:    #ede7d8;
    --line:      #d4c9b4;
    --muted:     #8a7e6e;
    --highlight: #f0e8d0;
    --rand:      #2a5880;
    --fs:        1;          /* 文字サイズ倍率（A-/A+で変化） */
  }

  /* rem基準のレイアウトを一括拡縮（ルートのfont-sizeを倍率で変更） */
  html { font-size: calc(100% * var(--fs)); }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    padding: 18px 24px 14px;
    text-align: center;
    position: relative;
  }
  /* 文字サイズ調整（ダーク背景ヘッダー右上） */
  .fs-ctrl {
    position: absolute; top: 12px; right: 12px;
    display: flex; align-items: center; gap: 5px;
  }
  .fs-ctrl button {
    width: 28px; height: 28px; border: 1px solid rgba(245,240,232,.45);
    background: rgba(245,240,232,.1); border-radius: 7px; color: var(--paper);
    font-weight: 600; cursor: pointer; line-height: 1; transition: .15s;
    font-family: 'Noto Serif JP', serif; padding: 0;
  }
  .fs-ctrl button:hover { background: rgba(245,240,232,.22); }
  .fs-ctrl button:active { background: var(--paper); color: var(--ink); }
  .fs-ctrl .fs-minus { font-size: 11px; } .fs-ctrl .fs-plus { font-size: 15px; }
  .fs-ctrl .fs-label { font-size: .62rem; color: var(--line); min-width: 26px; text-align: center; }
  header h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: .2em;
  }
  header p {
    font-size: .75rem;
    color: var(--line);
    margin-top: 4px;
    letter-spacing: .1em;
  }

  .wuxing-bar { width: 100%; display: flex; height: 5px; }
  .wuxing-bar span { flex: 1; }
  .wuxing-bar .wood  { background: #4a7c4e; }
  .wuxing-bar .fire  { background: #c04a2a; }
  .wuxing-bar .earth { background: #b07830; }
  .wuxing-bar .metal { background: #9098a0; }
  .wuxing-bar .water { background: #2a5880; }

  .container {
    width: 100%;
    max-width: 700px;
    padding: 20px 16px 60px;
  }

  /* ── モード切替タブ ── */
  .mode-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 14px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .mode-tab {
    flex: 1;
    padding: 10px 4px;
    border: none;
    background: transparent;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: .82rem;
    cursor: pointer;
    color: var(--muted);
    transition: all .15s;
    border-right: 1px solid var(--line);
  }
  .mode-tab:last-child { border-right: none; }
  .mode-tab.active-seq { background: var(--cinnabar); color: white; }
  .mode-tab.active-rand { background: var(--rand); color: white; }
  .mode-tab:hover:not(.active-seq):not(.active-rand) { background: var(--highlight); }

  /* ── コントロール ── */
  .controls {
    background: var(--paper2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .filter-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--line);
    background: transparent;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: .78rem;
    cursor: pointer;
    color: var(--ink);
    transition: all .15s;
  }
  .filter-btn:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
  .filter-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .speed-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: .8rem;
    color: var(--muted);
  }
  .speed-row input[type=range] { flex: 1; accent-color: var(--cinnabar); }

  /* ── ランダム専用オプション ── */
  .rand-options {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: .8rem;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .rand-options label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .rand-options input[type=checkbox] { accent-color: var(--rand); width:15px; height:15px; }
  #randCount { width: 60px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: .82rem; background: white; }

  /* ── 再生エリア ── */
  .play-area {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--cinnabar);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: .9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-primary:hover { background: #9e3c2e; }
  .btn-primary.rand-mode { background: var(--rand); }
  .btn-primary.rand-mode:hover { background: #1e4060; }

  .btn-secondary {
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--muted);
    padding: 12px 18px;
    border-radius: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: .85rem;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-secondary:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
  .btn-secondary.rand-btn:hover { border-color: var(--rand); color: var(--rand); }

  /* ── 現在再生中 ── */
  .now-playing {
    background: white;
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 18px;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    transition: border-color .2s;
  }
  .now-playing.rand-border { border-color: var(--rand); }
  .now-playing .meridian { font-size: .8rem; color: var(--muted); letter-spacing: .1em; }
  .now-playing .ketsu-type { font-size: 1rem; color: var(--gold); font-weight: 500; }
  .now-playing .ketsu-type.rand-color { color: var(--rand); }
  .now-playing .point-name {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: .12em;
    line-height: 1.2;
  }
  .now-playing .reading { font-size: .85rem; color: var(--muted); letter-spacing: .06em; }
  .now-playing .rand-label {
    font-size: .72rem;
    color: var(--rand);
    letter-spacing: .1em;
    margin-bottom: 4px;
  }
  .now-playing .loc-line {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dotted var(--line);
    font-size: .74rem;
    line-height: 1.6;
    color: var(--muted);
  }
  .now-playing .loc-label {
    display: inline-block;
    background: var(--paper2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    margin-right: 6px;
    font-size: .66rem;
    color: var(--muted);
    letter-spacing: .08em;
    white-space: nowrap;
  }
  .now-playing.idle { border-color: var(--line); }
  .now-playing.idle .point-name { color: var(--muted); font-size: 1rem; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; }

  /* ── 進捗 ── */
  .progress-bar { height: 4px; background: var(--line); border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--cinnabar); border-radius: 2px; transition: width .3s ease; }
  .progress-fill.rand-fill { background: var(--rand); }
  .progress-label { font-size: .75rem; color: var(--muted); margin-bottom: 14px; text-align: right; }

  /* ── 一覧 ── */
  .list-section h2 {
    font-family: 'Noto Serif JP', serif;
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--muted);
    letter-spacing: .1em;
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .point-list { display: flex; flex-direction: column; gap: 3px; }
  .point-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: .8rem;
    cursor: pointer;
    transition: background .12s;
    align-items: center;
    border: 1px solid transparent;
  }
  .point-row:hover { background: var(--highlight); }
  .point-row.active { background: #fff8e8; border-color: var(--gold); }
  .point-row.rand-active { background: #e8f0f8; border-color: var(--rand); }
  .point-row .r-meridian { color: var(--muted); font-size: .7rem; }
  .point-row .r-q { color: var(--gold); font-size: .78rem; margin-top: 1px; }
  .point-row .r-right { text-align: right; }
  .point-row .r-name { font-family: 'Noto Serif JP', serif; font-size: .95rem; font-weight: 600; }
  .point-row .r-read { color: var(--muted); font-size: .68rem; letter-spacing: .03em; }
  .point-row .r-code { color: var(--muted); font-size: .62rem; margin-left: 5px; }

  .badge {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }
  .badge.wood  { background: #4a7c4e; }
  .badge.fire  { background: #c04a2a; }
  .badge.earth { background: #b07830; }
  .badge.metal { background: #9098a0; }
  .badge.water { background: #2a5880; }

  /* ランダム履歴バッジ */
  .history-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--rand);
    color: white;
    font-size: .6rem;
    font-weight: 600;
    margin-right: 4px;
    vertical-align: middle;
  }

  @media (max-width: 500px) {
    .point-row { grid-template-columns: 1fr auto; }
  }

  /* ── 音源セット切替（上位タブ） ── */
  .set-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .set-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 9px 6px;
    border: 1.5px solid var(--line);
    border-radius: 9px;
    background: transparent;
    font-family: 'Noto Serif JP', serif;
    font-size: .92rem;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
  }
  .set-tab span {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: .62rem;
    font-weight: 400;
    letter-spacing: .04em;
    opacity: .85;
  }
  .set-tab:hover:not(.active) { border-color: var(--gold); color: var(--gold); }
  .set-tab.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  /* ── 分類バッジ色 ── */
  .badge.c-goyo  { background: var(--cinnabar); }
  .badge.c-gego  { background: var(--sage); }
  .badge.c-hakkai{ background: var(--gold); }
  .badge.c-soshu { background: #2a5880; }
  .badge.c-hasso { background: #7a5573; }

  /* ── 読み確認一覧 ── */
  .yomi-section { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 14px; }
  .yomi-section > summary {
    cursor: pointer;
    font-family: 'Noto Serif JP', serif;
    font-size: .95rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: .08em;
    list-style: none;
  }
  .yomi-section > summary::-webkit-details-marker { display: none; }
  .yomi-section > summary::before { content: '▸ '; color: var(--gold); }
  .yomi-section[open] > summary::before { content: '▾ '; }
  .yomi-note { font-size: .72rem; color: var(--muted); margin: 8px 0 12px; line-height: 1.7; }
  .yomi-group { font-family: 'Noto Serif JP', serif; font-size: .82rem; color: var(--cinnabar);
    margin: 14px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 4px; letter-spacing: .08em; }
  .yomi-row { padding: 5px 4px; border-bottom: 1px dotted var(--line); font-size: .78rem; }
  .yomi-row .yq { color: var(--ink); }
  .yomi-row .ya { font-family: 'Noto Serif JP', serif; font-weight: 600; }
  .yomi-row .yk { display: block; color: var(--muted); font-size: .7rem; margin-top: 2px; letter-spacing: .04em; }
</style>
</head>
<body>

<header>
  <h1 id="hTitle">五 行 穴</h1>
  <p id="hSub">井・榮・兪・経・合 — 全60穴 読み上げ</p>
  <div class="fs-ctrl">
    <button class="fs-minus" id="fsMinus" title="文字を小さく" aria-label="文字を小さく">A−</button>
    <span class="fs-label" id="fsLabel">標準</span>
    <button class="fs-plus" id="fsPlus" title="文字を大きく" aria-label="文字を大きく">A＋</button>
  </div>
</header>
<div class="wuxing-bar">
  <span class="wood"></span><span class="fire"></span><span class="earth"></span><span class="metal"></span><span class="water"></span>
</div>

<div class="container">

  <!-- 音源セット切替 -->
  <div class="set-tabs">
    <button class="set-tab active" id="setKaruta" onclick="setSet('karuta')">かるた用音声<span>五行穴 60</span></button>
    <button class="set-tab" id="setAll" onclick="setSet('all')">全部入り<span>五行穴＋要穴 153</span></button>
  </div>

  <!-- モード切替 -->
  <div class="mode-tabs">
    <button class="mode-tab active-seq" id="tabSeq" onclick="setMode('seq')">▶ 順番に読む</button>
    <button class="mode-tab" id="tabRand" onclick="setMode('rand')">🔀 ランダム</button>
  </div>

  <!-- コントロール -->
  <div class="controls">
    <div class="filter-row" id="filterKaruta">
      <span style="font-size:.8rem;color:var(--muted)">絞り込み：</span>
      <button class="filter-btn active" data-filter="all">全経</button>
      <button class="filter-btn" data-filter="yin">陰経のみ</button>
      <button class="filter-btn" data-filter="yang">陽経のみ</button>
      <button class="filter-btn" data-filter="井">井穴</button>
      <button class="filter-btn" data-filter="榮">榮穴</button>
      <button class="filter-btn" data-filter="兪">兪穴</button>
      <button class="filter-btn" data-filter="経">経穴</button>
      <button class="filter-btn" data-filter="合">合穴</button>
    </div>

    <div class="filter-row" id="filterAll" style="display:none">
      <span style="font-size:.8rem;color:var(--muted)">絞り込み：</span>
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="cat:五行穴">五行穴</button>
      <button class="filter-btn" data-filter="cat:五要穴">五要穴</button>
      <button class="filter-btn" data-filter="五要穴/原穴">原穴</button>
      <button class="filter-btn" data-filter="五要穴/郄穴">郄穴</button>
      <button class="filter-btn" data-filter="五要穴/絡穴">絡穴</button>
      <button class="filter-btn" data-filter="五要穴/募穴">募穴</button>
      <button class="filter-btn" data-filter="五要穴/兪穴">兪穴</button>
      <button class="filter-btn" data-filter="cat:下合穴">下合穴</button>
      <button class="filter-btn" data-filter="cat:八会穴">八会穴</button>
      <button class="filter-btn" data-filter="cat:四総穴">四総穴</button>
      <button class="filter-btn" data-filter="cat:八脈交会穴">八脈交会穴</button>
    </div>

    <!-- ランダム専用オプション（ランダムモード時のみ表示） -->
    <div class="rand-options" id="randOptions" style="display:none">
      <span>出題数：</span>
      <input type="number" id="randCount" value="60" min="1" max="60">
      <span>問</span>
      <label><input type="checkbox" id="chkRepeat"> 重複あり</label>
    </div>

    <div class="speed-row">
      <span>速度：</span>
      <input type="range" id="speedSlider" min="0.6" max="2" step="0.1" value="0.9">
      <span id="speedVal">0.9×</span>
    </div>
    <div class="speed-row" id="rowP1">
      <span style="white-space:nowrap" id="lblP1">経名後<small style="font-size:.72em;opacity:.75">（五行穴）</small>：</span>
      <input type="range" id="pause1Slider" min="0" max="3" step="0.25" value="1">
      <span id="pause1Val">1.0秒</span>

(function(){
  const fsSteps=[0.85,1.0,1.15,1.3,1.45];
  const fsNames=['小','標準','大','特大','最大'];
  const FS_KEY='karuta-fs-idx';
  let fsIdx=1;
  try{ const s=parseInt(localStorage.getItem(FS_KEY),10); if(!isNaN(s)&&s>=0&&s<fsSteps.length) fsIdx=s; }catch(e){}
  function applyFs(){
    document.documentElement.style.setProperty('--fs', fsSteps[fsIdx]);
    const lbl=document.getElementById('fsLabel'); if(lbl) lbl.textContent=fsNames[fsIdx];
    try{ localStorage.setItem(FS_KEY, fsIdx); }catch(e){}
  }
  const minus=document.getElementById('fsMinus'), plus=document.getElementById('fsPlus');
  if(minus) minus.onclick=()=>{ if(fsIdx>0){ fsIdx--; applyFs(); } };
  if(plus)  plus.onclick=()=>{ if(fsIdx<fsSteps.length-1){ fsIdx++; applyFs(); } };
  applyFs();
})();

// ── 五行クラス／分類クラス ──
function goClass(go) {
  return {木:'wood',火:'fire',土:'earth',金:'metal',水:'water'}[go] || '';
}
function catClass(cat) {
  return {'五要穴':'c-goyo','下合穴':'c-gego','八会穴':'c-hakkai','四総穴':'c-soshu','八脈交会穴':'c-hasso'}[cat] || '';
}
function dotClass(p) { return p.cat === '五行穴' ? goClass(p.go) : catClass(p.cat); }
// カタカナ→ひらがな・区切りスペース除去（画面表示用）
function hira(s) {
  return (s || '').replace(/　/g,'').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}

// ── フィルタ ──
['filterKaruta','filterAll'].forEach(id => {
  document.getElementById(id).querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById(id).querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilter(btn.dataset.filter);
    });
  });
});
function applyFilter(f) {
  const src = SETS[currentSet];
  if (f === 'all')       filteredPoints = [...src];
  else if (f === 'yin')  filteredPoints = src.filter(p => p.yin === true);
  else if (f === 'yang') filteredPoints = src.filter(p => p.yin === false);
  else if (f.startsWith('cat:')) filteredPoints = src.filter(p => p.cat === f.slice(4));
  else if (f.includes('/')) {
    const [c, sb] = f.split('/');
    filteredPoints = src.filter(p => p.cat === c && p.sub === sb);
  }
  else filteredPoints = src.filter(p => p.type === f);

  // ランダム出題数：上限を追従させ、既定は「全部」
  //   前回の上限と同じ数（＝手で変えていない）なら新しい全件数へ。
  //   手入力した数はできるだけ残し、上限を超えるときだけ丸める。
  const rc = document.getElementById('randCount');
  const n  = filteredPoints.length;
  const prevMax = parseInt(rc.max, 10) || 0;
  const wasFull = parseInt(rc.value, 10) === prevMax;
  const cur = parseInt(rc.value, 10);
  rc.max = n;
  if (wasFull || !cur || cur > n) rc.value = n;

  currentIdx = 0;
  randQueue = [];
  randPos = 0;
  randStarted = false;
  stopAll();
  renderList();
  updateProgress();
  resetNowPlaying();
}

// ── ランダムキュー生成 ──
function buildRandQueue() {
  const count = Math.min(
    parseInt(document.getElementById('randCount').value) || 10,
    filteredPoints.length * 3  // 上限
  );
  const allowRepeat = document.getElementById('chkRepeat').checked;
  const src = [...filteredPoints];
  randQueue = [];

  if (allowRepeat) {
    for (let i = 0; i < count; i++) {
      randQueue.push(src[Math.floor(Math.random() * src.length)]);
    }
  } else {
    // Fisher-Yates shuffle
    const pool = [...src];
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    // 必要数だけ取り出し（問題数 > 穴数ならループ）
    for (let i = 0; i < count; i++) {
      randQueue.push(pool[i % pool.length]);
    }
  }
  randPos = 0;
}

// ── 一覧レンダリング ──
function renderList() {
  const list = document.getElementById('pointList');

    `;

}

async function jumpTo(i) {
  stopAll();
  stopFlag = false;
  const myEpoch = ++playEpoch;
  currentIdx = i;
  isPlaying = true;
  setPauseIcon();
  updateNowPlaying(filteredPoints[i], null);
  updateProgress();
  await speakOne(filteredPoints[i], i, null);
  if (myEpoch !== playEpoch) return;
  isPlaying = false;
  setPlayIcon();
}

// ── NowPlaying ──
function updateNowPlaying(p, randInfo) {
  const np = document.getElementById('nowPlaying');

  const typeColor = currentMode === 'rand' ? 'rand-color' : '';

      ${p.q}
    </div>

    ${foot ? `<div class="meridian">${foot}</div>` : ''}
    ${p.loc ? `<div class="loc-line"><span class="loc-label">部位</span>${p.loc}</div>` : ''}
  `;

  const flatIdx = filteredPoints.indexOf(p);
  const row = document.getElementById('row-' + flatIdx);

}

function resetNowPlaying() {
  const np = document.getElementById('nowPlaying');
  np.className = 'now-playing idle';

  document.querySelectorAll('.point-row').forEach(r => r.classList.remove('active','rand-active'));
}

// ── 進捗 ──
function updateProgress() {
  if (currentMode === 'seq') {
    const total = filteredPoints.length;
    const pct = total ? (currentIdx / total) * 100 : 0;
    document.getElementById('progFill').style.width = pct + '%';
    document.getElementById('progLabel').textContent = `${currentIdx} / ${total}`;
  } else {
    const total = randQueue.length;
    const pct = total ? (randPos / total) * 100 : 0;
    document.getElementById('progFill').style.width = pct + '%';
    document.getElementById('progLabel').textContent =
      total ? `${randPos} / ${total} 問` : 'ランダム待機中';
  }
}

// ── 音声合成 ──
function speak(text, rate) {
  return new Promise(resolve => {
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'ja-JP';
    utt.rate = rate;
    utt.onend = resolve;
    utt.onerror = resolve;
    speechSynthesis.speak(utt);
  });
}
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function speakOne(p, flatIdx, onDone) {
  const myEpoch = playEpoch;
  const stale = () => stopFlag || myEpoch !== playEpoch;
  const rate  = parseFloat(speedSlider.value);
  const gap1  = parseFloat(pause1Slider.value) * 1000;   // 経名後（1段目がある場合のみ）
  const gap2  = parseFloat(pause2Slider.value) * 1000;   // 出題後（＝解答までの間）

  if (p.headRead) {
    await speak(p.headRead, rate);
    if (stale()) return;
    if (gap1 > 0) await delay(gap1);
    if (stale()) return;
  }
  await speak(p.qRead, rate);
  if (stale()) return;
  if (gap2 > 0) await delay(gap2);
  if (stale()) return;
  await speak(p.read, rate);
  if (stale()) return;
  if (onDone) onDone();
}

// ── 連続再生（順番） ──
async function playSeq() {
  stopFlag = false;
  const myEpoch = ++playEpoch;
  while (currentIdx < filteredPoints.length && !stopFlag && myEpoch === playEpoch) {
    const p = filteredPoints[currentIdx];
    updateNowPlaying(p, null);
    updateProgress();
    await speakOne(p, currentIdx, null);
    if (stopFlag || myEpoch !== playEpoch) break;
    const gap3 = parseFloat(pause3Slider.value) * 1000;
    if (gap3 > 0) await delay(gap3);
    if (stopFlag || myEpoch !== playEpoch) break;
    currentIdx++;
    updateProgress();
  }
  if (myEpoch !== playEpoch) return;
  if (!stopFlag) {
    currentIdx = 0;
    updateProgress();
    resetNowPlaying();
  }
  isPlaying = false;
  setPlayIcon();
}

// ── 連続再生（ランダム） ──
async function playRand() {
  // 既存キューが残っている場合は再生成せず途中から再開する
  if (randQueue.length === 0 || randPos >= randQueue.length) {
    buildRandQueue();
  }
  if (randQueue.length === 0) return;
  stopFlag = false;
  const myEpoch = ++playEpoch;
  while (randPos < randQueue.length && !stopFlag && myEpoch === playEpoch) {
    const p = randQueue[randPos];
    updateNowPlaying(p, `${randPos + 1} / ${randQueue.length}`);
    updateProgress();
    randStarted = true;
    await speakOne(p, -1, null);
    if (stopFlag || myEpoch !== playEpoch) break;
    const gap3 = parseFloat(pause3Slider.value) * 1000;
    if (gap3 > 0) await delay(gap3);
    if (stopFlag || myEpoch !== playEpoch) break;
    randPos++;
    randStarted = false;
    updateProgress();
  }
  if (myEpoch !== playEpoch) return;
  if (!stopFlag) {
    randPos = 0;
    randStarted = false;
    updateProgress();
    resetNowPlaying();
  }
  isPlaying = false;
  setPlayIcon();
}

// ── 前の1問（ランダム）：キューを1つ戻して再生 ──
async function prevRand() {
  stopFlag = false;
  const myEpoch = ++playEpoch;
  if (randQueue.length === 0) return;
  if (randPos > 0) randPos--;   // 先頭では戻らず、その1問をもう一度読む
  randStarted = true;
  const p = randQueue[randPos];
  updateNowPlaying(p, `${randPos + 1} / ${randQueue.length}`);
  updateProgress();
  isPlaying = true;
  setPauseIcon();
  await speakOne(p, -1, null);
  if (myEpoch !== playEpoch) return;
  isPlaying = false;
  setPlayIcon();
}

// ── 次の1問（ランダム） ──
async function nextRand() {
  stopFlag = false;
  const myEpoch = ++playEpoch;
  if (randQueue.length === 0) buildRandQueue();
  // 一度でも再生していれば次へ進める（初回押下も含め常に1問前進）
  if (randStarted) {
    randPos++;
  }
  randStarted = true;
  if (randPos >= randQueue.length) {
    randPos = 0;
    buildRandQueue();
  }
  const p = randQueue[randPos];
  updateNowPlaying(p, `${randPos + 1} / ${randQueue.length}`);
  updateProgress();
  isPlaying = true;
  setPauseIcon();
  await speakOne(p, -1, null);
  if (myEpoch !== playEpoch) return;
  isPlaying = false;
  setPlayIcon();
}

function setPlayIcon() {
  document.getElementById('playIcon').innerHTML = '<polygon points="3,1 15,8 3,15"/>';
  document.getElementById('btnLabel').textContent = '再生開始';
}
function setPauseIcon() {
  document.getElementById('playIcon').innerHTML = '<rect x="3" y="1" width="4" height="14"/><rect x="9" y="1" width="4" height="14"/>';
  document.getElementById('btnLabel').textContent = '一時停止';
}

function stopAll() {
  stopFlag = true;
  playEpoch++;
  speechSynthesis.cancel();
  isPlaying = false;
  setPlayIcon();
}

function togglePlay() {
  if (isPlaying) {
    stopAll();
  } else {
    isPlaying = true;
    setPauseIcon();
    if (currentMode === 'seq') playSeq();
    else playRand();
  }
}

function prevPoint() {
  stopAll();
  if (currentMode === 'seq') {
    currentIdx = Math.max(0, currentIdx - 1);
    isPlaying = true;
    setPauseIcon();
    playSeq();
  } else {
    prevRand();
  }
}

function nextPoint() {
  stopAll();
  if (currentMode === 'seq') {
    currentIdx = Math.min(filteredPoints.length - 1, currentIdx + 1);
    isPlaying = true;
    setPauseIcon();
    playSeq();
  } else {
    nextRand();
  }
}

function resetPlay() {
  stopAll();
  currentIdx = 0;
  randQueue = [];
  randPos = 0;
  randStarted = false;
  updateProgress();
  resetNowPlaying();
}

// ── 読み確認一覧 ──
function renderYomiList() {
  const box = document.getElementById('yomiList');
  if (!box) return;
  const src = SETS[currentSet];
  let html = '';
  let lastKey = '';
  src.forEach(p => {
    const key = p.cat === '五行穴' ? '五行穴' : (p.cat === '五要穴' ? '五要穴／' + p.sub : p.cat);
    if (key !== lastKey) { html += `<div class="yomi-group">${key}</div>`; lastKey = key; }
    const q = [p.head, p.q].filter(Boolean).join('　');
    const k = [hira(p.headRead), hira(p.qRead), p.read].filter(Boolean).join('　');
    html += `<div class="yomi-row"><span class="yq">${q}</span> → <span class="ya">${p.name}</span>` +
            `<span class="yk">${k}</span></div>`;
  });
  box.innerHTML = html;
}

// ===== 自動バージョン確認（直接起動時・バックグラウンド復帰時・30分ごと）=====
// iframe内（統合ホーム経由）は親が管理するためスキップ。直接URLで開いた場合のみ動作。
(function(){
  if(window.top !== window.self) return;

  let _cv = null;   // 確認済みバージョン
  let _ck = false;  // 二重確認防止フラグ

  async function _autoCheck(){
    if(_ck) return;
    _ck = true;
    try{
      const res = await fetch('./version.json?_=' + Date.now(), {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      const latest = j.version || null;
      if(!latest){ _ck=false; return; }
      if(_cv && latest !== _cv){
        // バージョン変化→リロード（画面保持は直接起動なので考慮不要）
        location.reload();
        return;
      }
      _cv = latest;
    }catch(e){
      if(!_cv){
        // 起動時に接続不可→オフラインエラー表示
        document.body.innerHTML =
          '<div style="position:fixed;inset:0;display:flex;flex-direction:column;' +
          'align-items:center;justify-content:center;text-align:center;padding:32px;' +
          'background:#f5f7fa;font-family:sans-serif;color:#2c3e50;">' +
          '<div style="font-size:48px;margin-bottom:16px;">📶</div>' +
          '<h2 style="margin-bottom:12px;">オンライン接続が必要です</h2>' +
          '<p style="color:#7a8a99;">インターネットに接続してから再度お試しください。</p></div>';
        return;
      }
      // 起動後の確認失敗はサイレントにスキップ
    }finally{ _ck = false; }
  }

  _autoCheck(); // 起動時
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) _autoCheck(); }); // 復帰時
  setInterval(()=>{ if(!document.hidden) _autoCheck(); }, 30 * 60 * 1000); // 30分ごと
})();

</script>
</body>
